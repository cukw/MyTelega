name: build-and-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: .
  RELEASE_TAG: build-${{ github.sha }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.matrix.outputs.desktop }}
      android: ${{ steps.matrix.outputs.android }}
      ios: ${{ steps.matrix.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            common:
              - 'src/**'
              - 'src-tauri/src/**'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/tauri.conf.json'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - '.github/workflows/release.yml'
              - 'scripts/ci/**'
            desktop_only:
              - 'src-tauri/capabilities/**'
              - 'src-tauri/icons/**'
            android_only:
              - 'src-tauri/gen/android/**'
            ios_only:
              - 'src-tauri/gen/apple/**'

      - id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_count="$(gh release list --limit 1 --json tagName --jq 'length')"
          if [[ "$release_count" -eq 0 ]]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

      - id: matrix
        run: |
          desktop=false
          android=false
          ios=false

          if [[ "${{ steps.bootstrap.outputs.bootstrap }}" == "true" ]]; then
            desktop=true
            android=true
            ios=true
          fi

          if [[ "${{ steps.filter.outputs.common }}" == "true" || "${{ steps.filter.outputs.desktop_only }}" == "true" ]]; then
            desktop=true
          fi

          if [[ "${{ steps.filter.outputs.common }}" == "true" || "${{ steps.filter.outputs.android_only }}" == "true" ]]; then
            android=true
          fi

          if [[ "${{ steps.filter.outputs.common }}" == "true" || "${{ steps.filter.outputs.ios_only }}" == "true" ]]; then
            ios=true
          fi

          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  create_release:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Create or keep release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release exists: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --title "ProxyTG build ${GITHUB_SHA::12}" \
              --notes "Automated build for commit $GITHUB_SHA"
          fi

  build_linux:
    runs-on: ubuntu-22.04
    needs: [changes, create_release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Linux deps
        if: needs.changes.outputs.desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.desktop == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build Linux bundle
        if: needs.changes.outputs.desktop == 'true'
        env:
          PROXY_BASE_URL: ${{ vars.PROXY_BASE_URL }}
          PROXY_API_KEY: ${{ vars.PROXY_API_KEY }}
          PROXY_TIMEOUT_MS: ${{ vars.PROXY_TIMEOUT_MS || '15000' }}
        run: |
          npm ci
          npm run tauri:build -- --bundles appimage,deb

          mkdir -p dist/linux
          APPIMAGE_PATH="$(find src-tauri/target -name '*.AppImage' | head -n1)"
          DEB_PATH="$(find src-tauri/target -name '*.deb' | head -n1 || true)"

          cp "$APPIMAGE_PATH" dist/linux/ProxyTG.AppImage
          if [[ -n "$DEB_PATH" ]]; then
            cp "$DEB_PATH" dist/linux/ProxyTG.deb
          fi

          tar -czf proxytg-linux.tar.gz -C dist/linux .

      - name: Upload Linux asset
        if: needs.changes.outputs.desktop == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" proxytg-linux.tar.gz --clobber

      - name: Reuse Linux asset
        if: needs.changes.outputs.desktop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/reuse_asset.sh "$RELEASE_TAG" "proxytg-linux.tar.gz"

  build_windows:
    runs-on: windows-latest
    needs: [changes, create_release]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.desktop == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build Windows bundle
        if: needs.changes.outputs.desktop == 'true'
        env:
          PROXY_BASE_URL: ${{ vars.PROXY_BASE_URL }}
          PROXY_API_KEY: ${{ vars.PROXY_API_KEY }}
          PROXY_TIMEOUT_MS: ${{ vars.PROXY_TIMEOUT_MS || '15000' }}
        shell: pwsh
        run: |
          npm ci
          npm run tauri:build -- --bundles msi

          $msi = Get-ChildItem -Path "src-tauri/target" -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) { throw "MSI artifact was not found" }

          Copy-Item $msi.FullName ProxyTG.msi -Force
          Compress-Archive -Path ProxyTG.msi -DestinationPath proxytg-windows.zip -Force

      - name: Upload Windows asset
        if: needs.changes.outputs.desktop == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" proxytg-windows.zip --clobber

      - name: Reuse Windows asset
        if: needs.changes.outputs.desktop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/ci/reuse_asset.sh "$RELEASE_TAG" "proxytg-windows.zip"

  build_macos:
    runs-on: macos-latest
    needs: [changes, create_release]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.desktop == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.desktop == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build macOS bundle
        if: needs.changes.outputs.desktop == 'true'
        env:
          PROXY_BASE_URL: ${{ vars.PROXY_BASE_URL }}
          PROXY_API_KEY: ${{ vars.PROXY_API_KEY }}
          PROXY_TIMEOUT_MS: ${{ vars.PROXY_TIMEOUT_MS || '15000' }}
        run: |
          npm ci
          npm run tauri:build -- --bundles app,dmg

          DMG_PATH="$(find src-tauri/target -name '*.dmg' | head -n1)"
          cp "$DMG_PATH" proxytg-macos.dmg
          zip -j proxytg-macos.zip proxytg-macos.dmg

      - name: Upload macOS asset
        if: needs.changes.outputs.desktop == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" proxytg-macos.zip --clobber

      - name: Reuse macOS asset
        if: needs.changes.outputs.desktop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/reuse_asset.sh "$RELEASE_TAG" "proxytg-macos.zip"

  build_android:
    runs-on: ubuntu-22.04
    needs: [changes, create_release]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.android == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.android == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: needs.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        if: needs.changes.outputs.android == 'true'

      - name: Build Android APK
        if: needs.changes.outputs.android == 'true'
        env:
          PROXY_BASE_URL: ${{ vars.PROXY_BASE_URL }}
          PROXY_API_KEY: ${{ vars.PROXY_API_KEY }}
          PROXY_TIMEOUT_MS: ${{ vars.PROXY_TIMEOUT_MS || '15000' }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

          npm ci
          npm run tauri -- android init || true
          npm run tauri -- android build -- --apk

          APK_PATH="$(find src-tauri/gen/android -name '*release*.apk' | head -n1)"
          cp "$APK_PATH" proxytg-android.apk

      - name: Upload Android asset
        if: needs.changes.outputs.android == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" proxytg-android.apk --clobber

      - name: Reuse Android asset
        if: needs.changes.outputs.android != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/reuse_asset.sh "$RELEASE_TAG" "proxytg-android.apk"

  build_ios:
    runs-on: macos-latest
    needs: [changes, create_release]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.ios == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.ios == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build iOS IPA
        if: needs.changes.outputs.ios == 'true'
        env:
          PROXY_BASE_URL: ${{ vars.PROXY_BASE_URL }}
          PROXY_API_KEY: ${{ vars.PROXY_API_KEY }}
          PROXY_TIMEOUT_MS: ${{ vars.PROXY_TIMEOUT_MS || '15000' }}
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

          npm ci
          npm run tauri -- ios init || true
          npm run tauri -- ios build || true

          IPA_PATH="$(find src-tauri/gen/apple -name '*.ipa' | head -n1 || true)"

          if [[ -n "$IPA_PATH" ]]; then
            cp "$IPA_PATH" proxytg-ios.ipa
          else
            APP_PATH="$(find src-tauri/gen/apple -name '*.app' | head -n1 || true)"
            if [[ -z "$APP_PATH" ]]; then
              echo "iOS build completed without .ipa or .app output" >&2
              exit 1
            fi
            mkdir -p package-ipa/Payload
            cp -R "$APP_PATH" package-ipa/Payload/
            (cd package-ipa && zip -qry ../proxytg-ios.ipa Payload)
          fi

      - name: Upload iOS asset
        if: needs.changes.outputs.ios == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" proxytg-ios.ipa --clobber

      - name: Reuse iOS asset
        if: needs.changes.outputs.ios != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/reuse_asset.sh "$RELEASE_TAG" "proxytg-ios.ipa"
